name: Run main.py every day at 10PM

on:
  schedule:
    # UTC 기준 12:43 = KST 21:43.
    # 정각(:00)은 GitHub 예약 실행이 몰려 몇 시간씩 밀리므로 피하고,
    # 남는 지연을 감안해 밤 10시보다 조금 앞당겨 둔다.
    - cron: '43 12 * * *'
  workflow_dispatch: 

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'  # 3.8은 ubuntu-latest(26.04)에서 제공되지 않음

    - name: Install dependencies
      run: |
        pip install -r requirements.txt  # 필요시

    - name: Run main.py
      run: |
        python main.py
